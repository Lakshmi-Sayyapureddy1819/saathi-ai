AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Saathi Care AI demo: one EC2 host (FastAPI + nginx/React in Docker, SQLite on an encrypted EBS volume) behind CloudFront
  (HTTPS, same-origin /api). Provider secrets come from an existing Secrets Manager secret. Single backend instance by design.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    purpose: Low-cost interview demo, not a production topology (single instance, SQLite, plain HTTP from CloudFront to origin).
    must:
      - Exactly one backend instance. ADK sessions and per-session locks are in process memory; do not add an ASG or a second task.
      - Never put secret values in this template, in parameters, or in tags. Secrets are read from SecretArn at runtime.
      - Inbound port 80 stays restricted to the CloudFront origin-facing prefix list; add no SSH rule (use SSM Session Manager).

Parameters:
  SecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret (JSON) holding provider keys, COORDINATOR_TOKEN and ORIGIN_VERIFY.
    AllowedPattern: "^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"
  SourceKey:
    Type: String
    Description: S3 key (inside the stack's bucket) of the source tarball the deploy script uploads.
    Default: releases/saathi-source.tgz
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  CloudFrontPrefixListId:
    Type: String
    Description: Managed prefix list com.amazonaws.global.cloudfront.origin-facing in this Region.
    AllowedPattern: "^pl-[0-9a-f]+$"
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium]
  VolumeSizeGiB:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 100
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  SourceBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: Holds only the source tarball for bootstrapping; reproducible from Git, so no Retain/versioning.
        must: [Stay private, Never store secrets or .env files here]
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - { Id: expire-old-releases, Status: Enabled, ExpirationInDays: 30 }

  SourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SourceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SourceBucket.Arn, !Sub "${SourceBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/saathi/${AWS::StackName}"
      RetentionInDays: 14

  InstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Least privilege for the host - read ONE secret, read the release tarball, write its own log group, SSM Session Manager.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: saathi-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Sid: ReadOneSecret, Effect: Allow, Action: "secretsmanager:GetSecretValue", Resource: !Ref SecretArn }
              - { Sid: ReadReleaseObjects, Effect: Allow, Action: "s3:GetObject", Resource: !Sub "${SourceBucket.Arn}/*" }
              - Sid: WriteOwnLogs
                Effect: Allow
                Action: ["logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "${LogGroup.Arn}:*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        must: [No 0.0.0.0/0 ingress, No SSH]
    Properties:
      GroupDescription: Saathi host - HTTP only from CloudFront; outbound HTTPS/HTTP for packages and LLM APIs
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontPrefixListId, Description: CloudFront origin-facing }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "HTTPS (AWS APIs, package registries, LLM providers)" }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "HTTP (OS package mirrors)" }

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  Host:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        must: [IMDSv2 required, Encrypted volume, Hop limit 1 so containers cannot reach instance metadata]
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref HostSecurityGroup]
          AssociatePublicIpAddress: false
      MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 1 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: !Ref VolumeSizeGiB, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-host" }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/saathi-userdata.log) 2>&1
          # The Elastic IP is attached just after launch; wait for outbound connectivity.
          until curl -fsS -m 5 -o /dev/null https://aws.amazon.com; do sleep 5; done
          dnf install -y docker jq
          systemctl enable --now docker
          mkdir -p /opt/saathi/src
          cat > /opt/saathi/host.conf <<'CONF'
          REGION=${AWS::Region}
          SECRET_ARN=${SecretArn}
          LOG_GROUP=${LogGroup}
          CF_DOMAIN=${Distribution.DomainName}
          SOURCE_URI=s3://${SourceBucket}/${SourceKey}
          CONF
          # The deploy script uploads the tarball right after the stack starts; wait for it (up to 30 min).
          for i in $(seq 1 90); do aws s3 cp "s3://${SourceBucket}/${SourceKey}" /opt/saathi/src.tgz --region ${AWS::Region} && break || sleep 20; done
          tar -xzf /opt/saathi/src.tgz -C /opt/saathi/src
          bash /opt/saathi/src/deploy/host/run.sh

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Host

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Gives HTTPS on a default *.cloudfront.net certificate (needed for browser microphone access). CloudFront to origin is
          plain HTTP over the AWS network; encrypting that hop needs a custom domain and certificate (not in scope).
        must: [OriginReadTimeout 60 (slow LLM turns), /api/* never cached, Authorization header forwarded to the origin]
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} Saathi Care AI demo"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: saathi-host
            # Public DNS name of the Elastic IP, derived from the IP itself so the distribution does not depend on the instance.
            DomainName: !Sub
              - "ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com"
              - Dashed: !Join ["-", !Split [".", !Ref ElasticIp]]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub "{{resolve:secretsmanager:${SecretArn}:SecretString:ORIGIN_VERIFY}}"
        DefaultCacheBehavior:
          TargetOriginId: saathi-host
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled (index.html must never go stale)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: saathi-host
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad            # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # Managed-AllViewerExceptHostHeader (forwards Authorization)
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            Compress: true
          - PathPattern: /assets/*
            TargetOriginId: saathi-host
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6            # Managed-CachingOptimized (hashed files)
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            Compress: true

Outputs:
  SiteUrl:
    Description: Public HTTPS URL (frontend and /api)
    Value: !Sub "https://${Distribution.DomainName}"
  InstanceId:
    Value: !Ref Host
  SourceBucketName:
    Value: !Ref SourceBucket
  ElasticIp:
    Value: !Ref ElasticIp
  LogGroupName:
    Value: !Ref LogGroup
